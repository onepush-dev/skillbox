name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Dockerfile", "railway/**", "db/**", ".github/workflows/publish-ghcr.yml"]
permissions:
  contents: read
  packages: write
env:
  UPSTREAM_SHA: dfc974f36fcbc4d778b79cc0e16df0d312dece9f
  TAG: dfc974f
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kitze/skillbox
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upstream image (root Dockerfile, unmodified)
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/skillbox-base:${{ env.TAG }}
      - name: Railway layer
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: BASE=ghcr.io/onepush-dev/skillbox-base:${{ env.TAG }}
          tags: ghcr.io/onepush-dev/skillbox:${{ env.TAG }}
      - name: Database image
        uses: docker/build-push-action@v6
        with:
          context: db
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/skillbox-db:16.15
